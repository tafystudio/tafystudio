[project]
name = "ultrasonic-driver"
version = "0.1.0"
description = "ultrasonic sensor driver for Tafy RDOS"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "nats-py>=2.7.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.19.0",
    "aiohttp>=3.9.1",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "watchdog>=3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
