name: Test Installation

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/get.tafy.sh'
      - 'tests/installation/**'
      - '.github/workflows/test-installation.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/get.tafy.sh'
      - 'tests/installation/**'
      - '.github/workflows/test-installation.yml'
  workflow_dispatch:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test-installer-script:
    name: Test Installer Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      
      - name: Validate installer syntax
        run: bash -n scripts/get.tafy.sh
      
      - name: Run shellcheck
        run: shellcheck -x scripts/get.tafy.sh || true
      
      - name: Check installer permissions
        run: |
          # Ensure installer is executable
          chmod +x scripts/get.tafy.sh
          test -x scripts/get.tafy.sh

  test-platforms:
    name: Test on ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu:22.04
          - ubuntu:20.04
          - debian:11
          - debian:12
          - rockylinux:9
          - almalinux:9
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up test environment
        run: |
          chmod +x tests/installation/test_installation.sh
          mkdir -p tests/installation/logs
      
      - name: Test installation on ${{ matrix.platform }}
        run: |
          docker run --rm \
            -v $PWD:/workspace:ro \
            -e TAFY_TEST_MODE=1 \
            -e TAFY_SKIP_SYSTEMD=1 \
            ${{ matrix.platform }} \
            bash -c "
              # Install dependencies
              if command -v apt-get &> /dev/null; then
                apt-get update && apt-get install -y curl sudo
              elif command -v yum &> /dev/null; then
                yum install -y curl sudo
              fi
              
              # Run installer in dry-run mode
              bash /workspace/scripts/get.tafy.sh --dry-run --skip-preflight
              
              # Validate dry-run output
              if bash /workspace/scripts/get.tafy.sh --dry-run --skip-preflight 2>&1 | grep -q 'Dry run complete'; then
                echo '✓ Dry-run test passed'
              else
                echo '✗ Dry-run test failed'
                exit 1
              fi
            "
      
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: installation-logs-${{ matrix.platform }}
          path: tests/installation/logs/

  test-macos:
    name: Test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test installer on macOS
        run: |
          chmod +x scripts/get.tafy.sh
          # Test dry-run mode
          ./scripts/get.tafy.sh --dry-run || true
      
      - name: Check macOS compatibility warnings
        run: |
          # Installer should detect macOS and work in dry-run mode
          ./scripts/get.tafy.sh --dry-run --skip-preflight | grep -q "macos" || true

  test-components:
    name: Test Component Installation
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl sudo systemd
      
      - name: Test k3s installation
        run: |
          # Mock test - just verify the installer would attempt to install k3s
          export TAFY_TEST_MODE=1
          export TAFY_COMPONENT_TEST=k3s
          bash scripts/get.tafy.sh --component k3s --dry-run
      
      - name: Test NATS installation  
        run: |
          export TAFY_TEST_MODE=1
          export TAFY_COMPONENT_TEST=nats
          bash scripts/get.tafy.sh --component nats --dry-run
      
      - name: Test Helm installation
        run: |
          export TAFY_TEST_MODE=1
          export TAFY_COMPONENT_TEST=helm
          bash scripts/get.tafy.sh --component helm --dry-run

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [test-installer-script, test-platforms]
    steps:
      - uses: actions/checkout@v4
      
      - name: Run full test suite
        run: |
          chmod +x tests/installation/test_installation.sh
          export TEST_MODE=docker
          ./tests/installation/test_installation.sh
      
      - name: Generate test report
        if: always()
        run: |
          ls -la tests/installation/logs/
          cat tests/installation/logs/test_report_*.md || true
      
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: installation-test-report
          path: tests/installation/logs/test_report_*.md